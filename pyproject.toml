[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qlbm-dambreak"
version = "1.0.0"
description = "Quantum Lattice Boltzmann Method (QLBM) for Two-Phase Gas-Liquid Dam-Break Simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "qiskit>=1.0.0",
    "pytest>=7.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = [".", "classical", "quantum"]
